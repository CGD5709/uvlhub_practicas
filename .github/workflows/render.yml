name: Deploy to Render

on:
  push:
    branches:
      - main
    # 3. Dispara el flujo cuando se crea un tag
    tags:
      - '*' 
  pull_request:
    # 1. 'closed' es necesario para poder detectar cuando el PR se aprueba y mergea
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      
      # Sustituye este paso por el comando real de tus pruebas (ej. mvn test, npm test, pytest)
      - name: Run test suite
        run: echo "Ejecutando pruebas..."

  deploy:
    name: Deploy to Render
    # 2. Garantiza que el despliegue SOLO ocurra si el trabajo 'test' finaliza con éxito
    needs: test 
    runs-on: ubuntu-24.04
    
    # 1 y 3. Condición: Se despliega si es un PR mergeado O si es la creación de un Tag
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
